[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "polymarket-market-data"
version = "0.1.0"
description = "Bounded local Polymarket data collection with immutable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["httpx>=0.28,<0.29", "pyarrow>=19,<25", "duckdb>=1.3,<2", "filelock>=3.18,<4", "websockets>=15,<17"]

[project.scripts]
polymarket-market-data = "polymarket_market_data.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_market_data"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
